apis:
- name: Footway Agent Commerce (UCP)
  description: >-
    The footway.com storefront's agent-facing commerce surface. Built on Shopify,
    it implements the Universal Commerce Protocol (UCP) for agent-driven commerce:
    a UCP merchant profile at /.well-known/ucp advertising catalog search, cart,
    checkout, fulfillment, discount and order capabilities, and a UCP MCP endpoint
    (/api/ucp/mcp) that agents call for buyer-approved checkout. Read-only product,
    collection and search JSON endpoints are available without authentication;
    authenticated customer flows use Shopify Customer Account OIDC/OAuth 2.0.
  humanURL: https://footway.com/llms.txt
  baseURL: https://footway.com
