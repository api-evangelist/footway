aid: footway
name: Footway
description: >-
  Footway is a Nordic, data-driven e-commerce group (Nasdaq First North Growth
  Market, Stockholm) that operates the Footway footwear-and-fashion marketplace
  across roughly 24 European markets, carrying around 800 brands for more than
  two million customers, alongside its Operations-as-a-Service ("ECOM IN A BOX")
  merchant infrastructure at footwayplus.com / oaas.footway.com and a merchant
  portal at merchant.footwayplus.com. The consumer storefront at footway.com runs
  on Shopify and exposes an agent-native commerce surface: an llms.txt / agents.md
  agent guide, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a UCP MCP endpoint for buyer-approved agent checkout, and
  Shopify Customer Account OpenID Connect / OAuth 2.0 authentication.
